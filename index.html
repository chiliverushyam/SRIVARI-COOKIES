<head>

<style>
.benefits{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;padding:34px 8%;background:#fff;color:#241b1b}
.benefit{display:flex;align-items:center;gap:16px;min-width:0}
.benefitIcon{width:58px;height:58px;flex:0 0 58px;border-radius:50%;background:#f7e7e8;display:grid;place-items:center;font-size:23px;color:#260b0b}
.benefit b,.benefit small{display:block}.benefit b{font-size:16px;font-weight:600}
.benefit small{color:#777;font-size:14px;margin-top:6px}
footer#contact{background:#063e36;color:#fff;padding:48px 8% 22px;display:grid;grid-template-columns:1.5fr .85fr .95fr 1.1fr;gap:36px;align-items:start}
.footerBrand{max-width:320px}
.footerLogo{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;margin-bottom:18px}
.footerLogo img{width:44px;height:44px;border-radius:50%;object-fit:cover}
.footerLogo b{font-family:'Playfair Display',serif;font-size:19px}
.footerBrand p,.footerColumn a,.footerColumn p{color:#d7e0dc;font-size:14px;line-height:1.7;margin:0;text-decoration:none;overflow-wrap:anywhere}
.footerBrand p{margin-bottom:16px}
.socialLinks{display:flex;gap:12px;margin-top:18px}
.socialLinks a{width:46px;height:46px;border:1px solid #ffffff55;border-radius:50%;display:grid;place-items:center;color:#fff;background:#075e45;text-decoration:none;font-size:22px}
.footerColumn{display:flex;flex-direction:column;gap:13px}
.footerColumn h4{font-size:12px;letter-spacing:2px;margin:0 0 8px;color:#fff}
.footerColumn a:hover{color:#e5b64b;text-decoration:underline}
.footerContact p,.footerContact a{display:flex;align-items:flex-start;gap:9px}
.footerContact p:nth-of-type(1)::before{content:"📍"}
.footerContact p:nth-of-type(2)::before{content:"🏘️"}
.footerContact p:nth-of-type(3)::before{content:"📌"}
.footerContact a[href^="tel"]::before{content:"📞"}
.footerContact a[href^="mailto"]::before{content:"✉️"}
.footerContact small{color:#d7e0dc;font-size:12px;margin-top:8px}
footer#contact .copy{grid-column:1/-1;border-top:1px solid #ffffff35;padding-top:18px;text-align:center;font-size:12px;opacity:.85;color:#d7e0dc}
@media(max-width:700px){
 .benefits{grid-template-columns:1fr 1fr;gap:18px;padding:24px 18px}
 .benefit{gap:10px}.benefitIcon{width:44px;height:44px;flex-basis:44px;font-size:19px}
 .benefit b{font-size:13px}.benefit small{font-size:11px}
 footer#contact{grid-template-columns:1fr 1fr;gap:28px 18px;padding:36px 20px 22px}
 .footerBrand{grid-column:1/-1;max-width:none}.footerContact{grid-column:1/-1}
 .footerColumn a,.footerColumn p{font-size:13px}
 footer#contact .copy{grid-column:1/-1}
}
.vegNotice{display:inline-flex;align-items:center;gap:6px;color:#16803c;font-weight:700}
.vegSymbol{display:inline-block;width:14px;height:14px;border:1.5px solid #16803c;position:relative;flex:0 0 14px;box-sizing:border-box}
.vegSymbol::after{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:#16803c;left:2px;top:2px}
</style>
</head>
