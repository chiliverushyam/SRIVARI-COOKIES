<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Srivari Cookies - Quick Admin</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #faf5ef; padding: 16px; margin: 0; color: #333; max-width: 650px; margin: 0 auto; }
    h2 { color: #5a2e10; margin-top: 0; font-size: 1.3rem; }
    .card { background: #fff; padding: 14px; border-radius: 12px; margin-bottom: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); border: 1px solid #ebdcd0; }
    .title { font-size: 1.05rem; font-weight: bold; color: #431f06; display: flex; justify-content: space-between; align-items: center; }
    .badge-tag { font-size: 0.7rem; background: #f0e2d5; color: #5a2e10; padding: 2px 8px; border-radius: 6px; }
    .row { display: flex; gap: 10px; margin-top: 10px; align-items: center; }
    .input-group { display: flex; flex-direction: column; flex: 1; }
    .input-group label { font-size: 0.75rem; color: #777; margin-bottom: 3px; }
    input { padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; width: 100%; }
    .actions { display: flex; gap: 8px; margin-top: 12px; }
    button { flex: 1; padding: 10px; border-radius: 8px; border: none; font-size: 0.85rem; font-weight: bold; cursor: pointer; }
    .btn-save { background: #7b3f18; color: #fff; }
    .btn-delete { background: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; flex: 0.45; }
    .btn-add { background: #075e45; color: #fff; width: 100%; padding: 12px; font-size: 0.95rem; }
    .in { background: #e6f4ea; color: #137333; border: 1px solid #ceead6; }
    .out { background: #fce8e6; color: #c5221f; border: 1px solid #fad2cf; }
    .status-msg { text-align: center; color: #666; margin: 20px 0; }
    .add-box { background: #fff; border: 2px dashed #bfa38e; padding: 16px; border-radius: 12px; margin-bottom: 20px; }
    .add-box h3 { margin: 0 0 10px 0; color: #5a2e10; font-size: 1.1rem; }
  </style>
</head>
<body>
  <h2>🍪 Srivari Quick Stock & Price Manager</h2>

  <!-- ADD NEW PRODUCT FORM -->
  <div class="add-box">
    <h3>＋ Add New Cookie Product</h3>
    <form id="addForm" onsubmit="handleCreateProduct(event)">
      <div class="row">
        <div class="input-group">
          <label>Cookie Name *</label>
          <input id="new-name" placeholder="e.g. Kaju Pista Crunch" required>
        </div>
        <div class="input-group">
          <label>Product Slug (ID) *</label>
          <input id="new-id" placeholder="e.g. kaju-pista" required pattern="[a-z0-9_-]+">
        </div>
      </div>
      <div class="row">
        <div class="input-group">
          <label>200g Price (₹) *</label>
          <input id="new-p2" type="number" placeholder="250" required>
        </div>
        <div class="input-group">
          <label>400g Price (₹) *</label>
          <input id="new-p4" type="number" placeholder="500" required>
        </div>
      </div>
      <div class="row">
        <div class="input-group">
          <label>Badge Text</label>
          <input id="new-badge" placeholder="e.g. SPECIAL / NEW">
        </div>
        <div class="input-group">
          <label>Image URL / Path</label>
          <input id="new-image" value="assets/hero-cookie.jpg">
        </div>
      </div>
      <div style="margin-top: 14px;">
        <button type="submit" class="btn-add">Add Cookie to Live Store</button>
      </div>
    </form>
  </div>

  <!-- PRODUCT LIST FROM D1 DATABASE -->
  <div id="list" class="status-msg">Loading products from database...</div>

  <script>
    const API = 'https://srivari-orders-api.chiluverushyam8790.workers.dev';
    const SECRET = 'srivari2026';

    async function loadProducts() {
      const box = document.getElementById('list');
      try {
        const res = await fetch(`${API}/products`, { cache: 'no-store' });
        const data = await res.json();
        
        if (!data.success || !data.products.length) {
          box.innerHTML = '<div class="card">No products found in database. Add one above!</div>';
          return;
        }

        box.innerHTML = data.products.map(p => `
          <div class="card" id="card-${p.id}">
            <div class="title">
              <span>${p.name}</span>
              <span class="badge-tag">${p.badge || 'FRESH'}</span>
            </div>
            <div class="row">
              <div class="input-group">
                <label>200g Price (₹)</label>
                <input id="p2-${p.id}" type="number" value="${p.price200}">
              </div>
              <div class="input-group">
                <label>400g Price (₹)</label>
                <input id="p4-${p.id}" type="number" value="${p.price400}">
              </div>
            </div>
            <div class="actions">
              <button class="btn-save" onclick="savePrice('${p.id}')">Save Price</button>
              <button class="${p.in_stock ? 'in' : 'out'}" onclick="toggleStock('${p.id}', ${p.in_stock ? 0 : 1})">
                ${p.in_stock ? '● In Stock' : '✕ Out of Stock'}
              </button>
              <button class="btn-delete" title="Remove from store" onclick="removeProduct('${p.id}', '${p.name}')">🗑 Remove</button>
            </div>
          </div>
        `).join('');
      } catch (err) {
        box.innerHTML = 'Error loading products. Check internet or Worker.';
      }
    }

    async function savePrice(id) {
      const price200 = Number(document.getElementById(`p2-${id}`).value);
      const price400 = Number(document.getElementById(`p4-${id}`).value);
      
      const btn = event.target;
      const oldText = btn.textContent;
      btn.textContent = 'Saving...';
      btn.disabled = true;

      try {
        const res = await fetch(`${API}/admin/update-product`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ secret: SECRET, id, price200, price400 })
        });
        const data = await res.json().catch(()=>({}));
        if(data.success) {
          alert('Price updated successfully!');
        } else {
          alert(data.error || 'Price update failed.');
        }
      } catch (e) {
        alert('Failed to update price.');
      } finally {
        btn.textContent = oldText;
        btn.disabled = false;
        loadProducts();
      }
    }

    async function toggleStock(id, nextState) {
      try {
        const res = await fetch(`${API}/admin/update-product`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ secret: SECRET, id, in_stock: nextState })
        });
        const data = await res.json().catch(()=>({}));
        if(data.success) {
          loadProducts();
        } else {
          alert(data.error || 'Failed to update stock status.');
        }
      } catch (e) {
        alert('Failed to update stock status.');
      }
    }

    async function handleCreateProduct(e) {
      e.preventDefault();
      const id = document.getElementById('new-id').value.trim().toLowerCase();
      const name = document.getElementById('new-name').value.trim();
      const price200 = Number(document.getElementById('new-p2').value);
      const price400 = Number(document.getElementById('new-p4').value);
      const badge = document.getElementById('new-badge').value.trim() || 'FRESH';
      const image = document.getElementById('new-image').value.trim() || 'assets/hero-cookie.jpg';

      const btn = e.target.querySelector('button[type="submit"]');
      btn.disabled = true;
      btn.textContent = 'Adding Product...';

      try {
        const res = await fetch(`${API}/admin/update-product`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            secret: SECRET,
            action: 'upsert',
            id,
            name,
            price200,
            price400,
            badge,
            image,
            in_stock: 1
          })
        });
        const data = await res.json().catch(()=>({}));
        if(data.success) {
          alert(`Cookie "${name}" added successfully!`);
          document.getElementById('addForm').reset();
          document.getElementById('new-image').value = 'assets/hero-cookie.jpg';
          loadProducts();
        } else {
          alert(data.error || 'Failed to add product.');
        }
      } catch(err) {
        alert('Network error while adding product.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Add Cookie to Live Store';
      }
    }

    async function removeProduct(id, name) {
      if(!confirm(`Are you sure you want to remove "${name}" from the store?`)) return;

      try {
        const res = await fetch(`${API}/admin/update-product`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            secret: SECRET,
            action: 'delete',
            id
          })
        });
        const data = await res.json().catch(()=>({}));
        if(data.success) {
          alert(`"${name}" removed successfully!`);
          loadProducts();
        } else {
          // If delete endpoint isn't present in worker, it disables stock to hide it
          await toggleStock(id, 0);
          alert(`Product set to Out of Stock.`);
        }
      } catch(err) {
        alert('Network error while removing product.');
      }
    }

    loadProducts();
  </script>
</body>
</html>
